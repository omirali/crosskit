<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Ни одного внешнего источника: скрипты только из бандла, стили — свои и те, что Cytoscape
     ставит элементам. Сеть странице не нужна и не дана (ADR 0046). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #graph { position: absolute; inset: 0; }
</style>
<script src="vendor/cytoscape.min.js"></script>
<script src="vendor/cytoscape-dagre.min.js"></script>
<script src="camera.js"></script>
<script src="graph.js"></script>
</head>
<body><div id="graph"></div></body>
</html>
