# Русский язык для поискового анализатора.
#
# Правила — алгоритм Snowball, а не список окончаний: он написан не здесь, широко проверен
# и покрывает русскую морфологию полнее, чем список, который мы бы составили сами.
#
# Букв-улик нет, и это не упущение. Каждая буква русского алфавита есть и в казахском,
# поэтому кириллический токен без казахских букв мог написать и тот и другой язык — если оба
# объявлены, он нормализуется обоими (ADR 0017).
#
# Версию менять при любом изменении правил: она попадает в отпечаток анализатора, и по ней
# `doctor` отличает индекс, написанный прежними правилами.
name = "ru"
version = "1"
script = "cyrillic"
alphabet = "абвгдеёжзийклмнопрстуфхцчшщъыьэюя"
evidence = ""

[stemming]
kind = "snowball"
algorithm = "russian"
