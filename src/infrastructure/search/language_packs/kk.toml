# Қазақ тілі — казахский язык для поискового анализатора.
#
# Здесь правила — данные, а не алгоритм из библиотеки: Snowball казахского не знает.
# Казахский агглютинативен, окончания приклеиваются слоями в одном порядке —
# `кітап` + `тар` (мн. ч.) + `ымыз` (наш) + `да` (в) — поэтому снимаются они в обратном:
# сначала падеж, затем принадлежность, затем множественное число. По одному окончанию со
# слоя, самое длинное совпадение выигрывает.
#
# `minimum_stem_chars` — не украшение: без него `тар` теряет собственные три буквы, и все
# короткие слова языка схлопываются в одно.
#
# Буквы-улики — девять букв, которых нет в русском алфавите. Токен с любой из них однозначно
# казахский; токен без них мог написать и русский, и тогда его нормализуют оба объявленных
# языка (ADR 0017).
name = "kk"
version = "1"
script = "cyrillic"
alphabet = "аәбвгғдеёжзийкқлмнңоөпрстуұүфхһцчшщъыіьэюя"
evidence = "әғқңөұүһі"

[stemming]
kind = "suffixes"
minimum_stem_chars = 2

# Падежи: местный, исходный, направительный, родительный, винительный, творительный.
# Варианты одного падежа различаются по закону сингармонизма и по звонкости последней буквы
# основы; здесь перечислены все, потому что правило звучит одинаково для каждого.
#
# `сын/сін/ын/ін` — винительный поверх притяжательного, снимаемый одним куском. Голое `н`
# здесь стояло и срезало собственную последнюю букву у слов вроде `өзен` и `аудан`; замер на
# эталонных группах это показал, и правило заменено (ADR 0017).
[[stemming.step]]
name = "case"
suffixes = [
    "ның", "нің", "дың", "дің", "тың", "тің",
    "нда", "нде", "дан", "ден", "тан", "тен", "нан", "нен",
    "мен", "бен", "пен",
    "сын", "сін", "ын", "ін",
    "ға", "ге", "қа", "ке", "на", "не",
    "ны", "ні", "ды", "ді", "ты", "ті",
    "да", "де", "та", "те",
]

# Принадлежность: наш, ваш, мой, твой, его — в том числе после падежа, снятого выше.
[[stemming.step]]
name = "possessive"
suffixes = [
    "ымыз", "іміз", "ыңыз", "іңіз",
    "лары", "лері", "дары", "дері", "тары", "тері",
    "сы", "сі", "ым", "ім", "ың", "ің",
    "ы", "і",
]

# Множественное число: шесть вариантов одного окончания.
[[stemming.step]]
name = "plural"
suffixes = ["лар", "лер", "дар", "дер", "тар", "тер"]
