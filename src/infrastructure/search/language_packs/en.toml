# Английский язык для поискового анализатора.
#
# Правила — алгоритм Snowball. Алфавит задан диапазонами: базовая латиница плюс блоки
# Latin-1 Supplement, Latin Extended-A и Latin Extended-B, чтобы `café` и `naïve` считались
# написанными этим языком. Внутри диапазона встречаются не-буквы (знаки умножения и деления),
# и их отсекает общее правило: кандидат обязан быть буквой.
#
# Букв-улик нет: другого языка латиницей пока не объявляют, а если объявят, улики появятся
# у него.
name = "en"
version = "1"
script = "latin"
alphabet = ""
alphabet_ranges = ["0041-005A", "0061-007A", "00C0-024F"]
evidence = ""

[stemming]
kind = "snowball"
algorithm = "english"
