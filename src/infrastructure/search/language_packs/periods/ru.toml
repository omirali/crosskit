# Фразы периода для русского языка: какие слова вопроса называют какой отрезок времени.
#
# Перечень закрыт. Фраза, которой здесь нет, периодом не считается, и вопрос обрабатывается
# так же, как до этапа 40. Слова пишутся строчными буквами без знаков препинания; вопрос
# сравнивается с ними так же — регистр и знаки вокруг слова не мешают («Неделе?» = «неделе»).
#
# Ключи — одни на все языки (`last-week`, `month-09`), и каждый язык обязан назвать каждый
# ключ: это проверяет тест, чтобы «в сентябре» не работало по-русски и молчало по-английски.
# Месяц по имени — ближайший начавшийся: «в сентябре», спрошенное в октябре, — этот сентябрь.
language = "ru"

[phrases]
today = ["сегодня", "за сегодня"]
yesterday = ["вчера", "за вчера"]
this-week = ["на этой неделе", "за эту неделю"]
last-week = ["на прошлой неделе", "за прошлую неделю"]
this-month = ["в этом месяце", "за этот месяц"]
last-month = ["в прошлом месяце", "за прошлый месяц"]
month-01 = ["в январе", "за январь"]
month-02 = ["в феврале", "за февраль"]
month-03 = ["в марте", "за март"]
month-04 = ["в апреле", "за апрель"]
month-05 = ["в мае", "за май"]
month-06 = ["в июне", "за июнь"]
month-07 = ["в июле", "за июль"]
month-08 = ["в августе", "за август"]
month-09 = ["в сентябре", "за сентябрь"]
month-10 = ["в октябре", "за октябрь"]
month-11 = ["в ноябре", "за ноябрь"]
month-12 = ["в декабре", "за декабрь"]
